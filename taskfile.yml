version: '3'

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  build:
    desc: Debug build of the whole workspace
    cmds:
      - cargo build --workspace

  release:
    desc: Release build of the shelf binary
    cmds:
      - cargo build --release -p shelf

  test:
    desc: Run the whole test suite
    cmds:
      - cargo test --workspace

  test:one:
    desc: Run tests matching FILTER, eg task test:one FILTER=gesture
    requires:
      vars: [FILTER]
    cmds:
      - cargo test --workspace {{.FILTER}}

  fmt:
    desc: Format the workspace
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Fail if anything is unformatted
    cmds:
      - cargo fmt --all -- --check

  lint:
    desc: Clippy over all targets with warnings denied
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  lint:device:
    desc: Clippy the device build, which the host lint never compiles
    cmds:
      - cargo clippy -p shelf --no-default-features --features device -- -D warnings

  check:
    desc: Everything a CI run would do
    cmds:
      - task: fmt:check
      - task: lint
      - task: lint:device
      - task: test
      - task: test:card

  test:card:
    desc: Test the scripts Shelf ships on the card, off-device
    cmds:
      - sh card/test-shelfpak.sh

  icons:
    desc: Re-fetch the nerd font symbols used by the HUD
    vars:
      ASSETS: crates/shelf-ui/assets
      TTF: SymbolsNerdFontMono-Regular.ttf
    cmds:
      - |
        set -euo pipefail
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        curl -fsSL -o "$tmp/symbols.zip" \
          "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/NerdFontsSymbolsOnly.zip"
        unzip -o -q "$tmp/symbols.zip" '{{.TTF}}' LICENSE -d "$tmp"
        mv "$tmp/{{.TTF}}" "{{.ASSETS}}/{{.TTF}}"
        mv "$tmp/LICENSE" "{{.ASSETS}}/{{.TTF}}.LICENSE.txt"
        echo "fetched {{.ASSETS}}/{{.TTF}}"

  run:
    desc: >-
      Run the shelf in a window on this machine against SHELF_ROOT, defaults to ./sdcard. Set
      SHELF_ROMS to a NextUI Roms folder to shelve its games
    env:
      SHELF_ROOT: '{{.SHELF_ROOT | default "./sdcard"}}'
    cmds:
      - cargo run --release -p shelf

  run:bare:
    desc: Run with no title bar or border, for screenshots and screen capture
    env:
      SHELF_ROOT: '{{.SHELF_ROOT | default "./sdcard"}}'
      SHELF_BARE: '1'
    cmds:
      - cargo run --release -p shelf

  run:4x3:
    desc: Run in a 4:3 window, as on the TrimUI Brick
    env:
      SHELF_ROOT: '{{.SHELF_ROOT | default "./sdcard"}}'
      SHELF_WINDOW: '1280x960'
    cmds:
      - cargo run --release -p shelf

  run:debug:
    desc: Run an unoptimised build, for a debugger. Will not hold 60 fps.
    env:
      SHELF_ROOT: '{{.SHELF_ROOT | default "./sdcard"}}'
    cmds:
      - cargo run -p shelf

  device:sh:
    desc: Run CMD on the box the device build wants, fetching one if this is not it
    internal: true
    requires:
      vars: [CMD]
    cmds:
      - |
        set -eu
        if [ "$(uname -s)-$(uname -m)" = "Linux-aarch64" ]; then
          sh -c '{{.CMD}}'
        else
          docker run --rm -v "$PWD":/src -w /src rust:1-bullseye sh -c '{{.CMD}}'
        fi

  build:device:
    desc: Build for the TrimUI Brick, in an arm64 container unless this is already one
    cmds:
      - task: device:sh
        vars:
          CMD: >-
            cargo build --profile device --target-dir target-device
            -p shelf --no-default-features --features device
      - file target-device/device/shelf | grep -q aarch64
      - 'echo "built target-device/device/shelf"'

  dist:brick:
    desc: >-
      Build the TrimUI Brick pak for NextUI, OUT defaults to ./dist-brick. Shelf runs there as a
      game picker: games open in NextUI's own emulator paks and come back to Shelf when they quit
    deps: [build:device]
    vars:
      OUT: '{{.OUT | default "dist-brick"}}'
      PAK: '{{.OUT | default "dist-brick"}}/Tools/tg5040/Shelf.pak'
    cmds:
      - rm -rf {{.OUT}}
      - mkdir -p {{.PAK}}
      - cp card/tg5040/Shelf.pak/launch.sh {{.PAK}}/launch.sh
      - cp target-device/device/shelf {{.PAK}}/shelf
      - cp LICENSE {{.PAK}}/LICENSE
      - cp crates/shelf-ui/assets/label.ttf.OFL.txt {{.PAK}}/FONT-LICENSE-OpenSans.txt
      - cp crates/shelf-ui/assets/SymbolsNerdFontMono-Regular.ttf.LICENSE.txt {{.PAK}}/FONT-LICENSE-NerdFontSymbols.txt
      - cd {{.OUT}} && zip -qr shelf-brick-pak.zip Tools
      - 'echo "brick pak ready at {{.PAK}}, copy {{.OUT}}/Tools onto the SD card root"'

  clean:
    desc: Remove build output and the pak
    cmds:
      - cargo clean
      - rm -rf dist-brick target-device
