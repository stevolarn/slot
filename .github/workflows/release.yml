name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: brick pak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust target
        run: |
          set -eu
          rustup show
          rustup target add aarch64-unknown-linux-gnu

      - name: Install zig and cargo-zigbuild
        run: |
          set -eu
          python3 -m pip install --user --break-system-packages ziglang
          cargo install --locked cargo-zigbuild
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build for the Brick
        run: |
          set -eu
          cargo zigbuild --profile device --target aarch64-unknown-linux-gnu.2.31 \
            --target-dir target-device -p shelf --no-default-features --features device

      - name: Assemble the pak
        run: |
          set -eu
          out=dist-brick
          pak="$out/Tools/tg5040/Slot.pak"
          mkdir -p "$pak"
          cp card/tg5040/Slot.pak/launch.sh "$pak/launch.sh"
          cp target-device/aarch64-unknown-linux-gnu/device/slot "$pak/slot"
          cp LICENSE "$pak/LICENSE"
          cp crates/shelf-ui/assets/label.ttf.OFL.txt "$pak/FONT-LICENSE-OpenSans.txt"
          cp crates/shelf-ui/assets/SymbolsNerdFontMono-Regular.ttf.LICENSE.txt "$pak/FONT-LICENSE-NerdFontSymbols.txt"
          chmod +x "$pak/launch.sh" "$pak/slot"
          file "$pak/slot" | grep -q aarch64
          (cd "$out" && zip -qr slot-brick-pak.zip Tools)

      - name: Test the pak's launch script
        run: sh card/test-slotpak.sh

      - uses: actions/upload-artifact@v4
        with:
          name: slot-brick-pak.zip
          path: dist-brick/slot-brick-pak.zip
          if-no-files-found: error

  publish:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: slot-brick-pak.zip

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cat > notes.md <<'NOTES'
          Unzip and copy `Tools` onto the root of the Brick's SD card, then open Tools > Slot. Needs NextUI.
          NOTES
          gh release create "$GITHUB_REF_NAME" slot-brick-pak.zip --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
